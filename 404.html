<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden — Fitness Park Offenbach</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF9F7">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-512.png">
<link rel="apple-touch-icon" href="/assets/img/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">

<style>
  .oops{
    min-height:100dvh; display:grid; place-items:center;
    padding:6rem 1.25rem 4rem; text-align:center;
  }
  .oops__num{
    font-family:var(--display); font-weight:900;
    font-size:clamp(6rem,22vw,16rem); line-height:.85;
    letter-spacing:-.05em; color:var(--red);
    margin-bottom:1rem;
  }
  .oops h1{
    font-size:clamp(1.5rem,4vw,2.5rem); text-transform:uppercase;
    margin:0 0 1rem;
  }
  .oops p{ color:var(--ink-2); max-width:44ch; margin:0 auto 2rem; }
  .oops__links{ display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; }
</style>
</head>
<body>

<main class="oops">
  <div>
    <p class="oops__num" aria-hidden="true">404</p>
    <h1>Diese Seite gibt&nbsp;es nicht</h1>
    <p>
      Vielleicht hat sich ein Tippfehler eingeschlichen, oder die Seite ist
      umgezogen. Trainieren kannst du trotzdem — täglich ab 7 Uhr in der
      Rowentastraße&nbsp;9.
    </p>
    <div class="oops__links">
      <a class="btn btn--primary" href="/">Zur Startseite</a>
      <a class="btn btn--ghost" href="/#kurse">Zum Kursplan</a>
      <a class="btn btn--ghost" href="/#kontakt">Kontakt</a>
    </div>
  </div>
</main>

</body>
</html>
